<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced at build time by the `--base-href` argument. On GitHub Pages the
    app is served from /<repo>/, not the domain root, so this has to match or
    every asset 404s.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Brothers Hauling — the job pipeline. Three access levels, one board.">
  <meta name="theme-color" content="#111112">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Brothers Hauling">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Brothers Hauling</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111112; }

    /*
      Shown until Flutter paints its first frame. The web bundle is a couple of
      megabytes, and a blank black screen over a phone hotspot reads as a
      broken link.
    */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #111112;
      color: #F2F2F3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      z-index: 10;
    }
    #boot h1 {
      margin: 0;
      font-size: 30px;
      line-height: 0.95;
      letter-spacing: -0.01em;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
    }
    #boot h1 span { color: #F9570D; }
    #boot p { margin: 0; font-size: 13px; color: #A4A3A5; max-width: 340px; text-align: center; line-height: 1.5; }
    #boot.failed .bar { display: none; }
    #boot.failed p { color: #FF4D6D; }
    #boot a { color: #F9570D; }
    #boot .bar {
      width: 168px;
      height: 5px;
      border-radius: 3px;
      background: #242427;
      overflow: hidden;
    }
    #boot .bar i {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: #F9570D;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .bar i { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <h1>Brothers<br><span>Hauling</span></h1>
    <div class="bar" aria-hidden="true"><i></i></div>
    <p>Loading the board…</p>
  </div>

  <noscript>
    <div style="padding:32px;color:#F2F2F3;font-family:system-ui,sans-serif">
      <h1>Brothers Hauling</h1>
      <p>This app needs JavaScript enabled.</p>
    </div>
  </noscript>

  <script>
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;

      // Flutter fires this once it has actually painted, which is the only
      // honest moment to take the splash down.
      var painted = false;
      window.addEventListener('flutter-first-frame', function () {
        painted = true;
        clearTimeout(giveUp);
        boot.remove();
      });

      // Without this, anything that stops the engine starting — a browser
      // without WebGL, a blocked asset, an engine crash before the first
      // frame — leaves the visitor staring at "Loading the board…" forever.
      // Say what happened instead.
      var giveUp = setTimeout(function () {
        if (painted) return;
        boot.className = 'failed';
        boot.querySelector('p').innerHTML =
          "The board didn't finish loading. It needs a current browser with " +
          'JavaScript and WebGL enabled — try reloading, or open it in ' +
          'Chrome, Safari, Firefox or Edge.';
      }, 30000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
